<g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#1f2328" xml:space="preserve">
<text y="30"><tspan x="16.0" fill="#CF222E">@startuml</tspan></text>
<text y="50"><tspan x="16.0" fill="#8250DF">!include</tspan><tspan x="91.6" fill="#0550AE">common</tspan><tspan x="142.0" fill="#CF222E">.</tspan><tspan x="150.4" fill="#0550AE">puml</tspan></text>
<text y="70"><tspan x="16.0" fill="#1F2328">!$</tspan><tspan x="32.8" fill="#0550AE">name</tspan><tspan x="74.8" fill="#CF222E">=</tspan><tspan x="83.2" fill="#1F2328"> &quot;</tspan><tspan x="100.0" fill="#0550AE">Alice</tspan><tspan x="142.0" fill="#1F2328">&quot;</tspan></text>
<text y="90"><tspan x="16.0" fill="#8250DF">!function</tspan><tspan x="91.6" fill="#1F2328"> $</tspan><tspan x="108.4" fill="#0550AE">double</tspan><tspan x="158.8" fill="#1F2328">($</tspan><tspan x="175.6" fill="#0550AE">x</tspan><tspan x="184.0" fill="#1F2328">)</tspan></text>
<text y="110"><tspan x="32.8" fill="#8250DF">!return</tspan><tspan x="91.6" fill="#1F2328"> $</tspan><tspan x="108.4" fill="#0550AE">x</tspan><tspan x="116.8" fill="#1F2328"> + $</tspan><tspan x="150.4" fill="#0550AE">x</tspan></text>
<text y="130"><tspan x="16.0" fill="#8250DF">!endfunction</tspan></text>
<text y="150"><tspan x="16.0" fill="#6E7781">' a comment</tspan></text>
<text y="170"><tspan x="16.0" fill="#6E7781">/' a block</tspan></text>
<text y="190"><tspan x="16.0" fill="#6E7781">   comment '/</tspan></text>
<text y="210"><tspan x="16.0" fill="#CF222E">participant</tspan><tspan x="108.4" fill="#1F2328"> $</tspan><tspan x="125.2" fill="#0550AE">name</tspan></text>
<text y="230"><tspan x="16.0" fill="#0550AE">Alice</tspan><tspan x="66.4" fill="#CF222E">-&gt;</tspan><tspan x="91.6" fill="#0550AE">Bob</tspan><tspan x="116.8" fill="#1F2328">:</tspan><tspan x="125.2" fill="#1F2328"> %date()</tspan></text>
