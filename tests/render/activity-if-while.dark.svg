<svg xmlns="http://www.w3.org/2000/svg" width="259" height="292" viewBox="0 0 259 292">
<rect x="0.5" y="0.5" width="258" height="291" rx="6" fill="#0d1117" stroke="#3d444d"/>
<g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#e6edf3" xml:space="preserve">
<text y="30"><tspan x="16.0" fill="#FF7B72">@startuml</tspan></text>
<text y="50"><tspan x="16.0" fill="#FF7B72">start</tspan></text>
<text y="70"><tspan x="16.0" fill="#79C0FF">:read the data;</tspan></text>
<text y="90"><tspan x="16.0" fill="#FF7B72">if</tspan><tspan x="32.8" fill="#E6EDF3"> (</tspan><tspan x="49.6" fill="#A5D6FF">valid?</tspan><tspan x="100.0" fill="#E6EDF3">) </tspan><tspan x="116.8" fill="#FF7B72">then</tspan><tspan x="150.4" fill="#E6EDF3"> (</tspan><tspan x="167.2" fill="#E6EDF3">yes</tspan><tspan x="192.4" fill="#E6EDF3">)</tspan></text>
<text y="110"><tspan x="16.0" fill="#79C0FF">  :process;</tspan></text>
<text y="130"><tspan x="16.0" fill="#FF7B72">else</tspan><tspan x="49.6" fill="#E6EDF3"> (</tspan><tspan x="66.4" fill="#E6EDF3">no</tspan><tspan x="83.2" fill="#E6EDF3">)</tspan></text>
<text y="150"><tspan x="16.0" fill="#79C0FF">  :report an error;</tspan></text>
<text y="170"><tspan x="16.0" fill="#FF7B72">endif</tspan></text>
<text y="190"><tspan x="16.0" fill="#FF7B72">while</tspan><tspan x="58.0" fill="#E6EDF3"> (</tspan><tspan x="74.8" fill="#A5D6FF">more data?</tspan><tspan x="158.8" fill="#E6EDF3">) </tspan><tspan x="175.6" fill="#FF7B72">is</tspan><tspan x="192.4" fill="#E6EDF3"> (</tspan><tspan x="209.2" fill="#E6EDF3">yes</tspan><tspan x="234.4" fill="#E6EDF3">)</tspan></text>
<text y="210"><tspan x="16.0" fill="#79C0FF">  :next;</tspan></text>
<text y="230"><tspan x="16.0" fill="#FF7B72">endwhile</tspan><tspan x="83.2" fill="#E6EDF3"> (</tspan><tspan x="100.0" fill="#E6EDF3">no</tspan><tspan x="116.8" fill="#E6EDF3">)</tspan></text>
<text y="250"><tspan x="16.0" fill="#FF7B72">stop</tspan></text>
<text y="270"><tspan x="16.0" fill="#FF7B72">@enduml</tspan></text>
</g>
</svg>
