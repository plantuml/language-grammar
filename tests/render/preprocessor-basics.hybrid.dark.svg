<svg xmlns="http://www.w3.org/2000/svg" width="209" height="272" viewBox="0 0 209 272">
<rect x="0.5" y="0.5" width="208" height="271" rx="6" fill="#0d1117" stroke="#3d444d"/>
<g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#e6edf3" xml:space="preserve">
<text y="30"><tspan x="16.0" fill="#FF7B72">@startuml</tspan></text>
<text y="50"><tspan x="16.0" fill="#D2A8FF">!include</tspan><tspan x="83.2" fill="#E6EDF3"> common.puml</tspan></text>
<text y="70"><tspan x="16.0" fill="#E6EDF3">!$name = </tspan><tspan x="91.6" fill="#A5D6FF">&quot;Alice&quot;</tspan></text>
<text y="90"><tspan x="16.0" fill="#D2A8FF">!function</tspan><tspan x="91.6" fill="#E6EDF3"> $double($x)</tspan></text>
<text y="110"><tspan x="32.8" fill="#D2A8FF">!return</tspan><tspan x="91.6" fill="#E6EDF3"> $x + $x</tspan></text>
<text y="130"><tspan x="16.0" fill="#D2A8FF">!endfunction</tspan></text>
<text y="150"><tspan x="16.0" fill="#8B949E">' a comment</tspan></text>
<text y="170"><tspan x="16.0" fill="#8B949E">/' a block</tspan></text>
<text y="190"><tspan x="16.0" fill="#8B949E">   comment '/</tspan></text>
<text y="210"><tspan x="16.0" fill="#FF7B72">participant</tspan><tspan x="116.8" fill="#FFA657">$name</tspan></text>
<text y="230"><tspan x="16.0" fill="#FFA657">Alice</tspan><tspan x="66.4" fill="#FF7B72">-&gt;</tspan><tspan x="91.6" fill="#FFA657">Bob</tspan><tspan x="116.8" fill="#FF7B72">:</tspan><tspan x="125.2" fill="#A5D6FF"> %date()</tspan></text>
<text y="250"><tspan x="16.0" fill="#FF7B72">@enduml</tspan></text>
</g>
</svg>
