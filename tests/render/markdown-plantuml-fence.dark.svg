<svg xmlns="http://www.w3.org/2000/svg" width="368" height="232" viewBox="0 0 368 232">
<rect x="0.5" y="0.5" width="367" height="231" rx="6" fill="#0d1117" stroke="#3d444d"/>
<g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#e6edf3" xml:space="preserve">
<text y="30"><tspan x="16.0" fill="#79C0FF" font-weight="bold"># Sequence diagram</tspan></text>
<text y="50"></text>
<text y="70"><tspan x="16.0" fill="#E6EDF3">A PlantUML block inside a Markdown file:</tspan></text>
<text y="90"></text>
<text y="110"><tspan x="16.0" fill="#E6EDF3">```plantuml</tspan></text>
<text y="130"><tspan x="16.0" fill="#FF7B72">@startuml</tspan></text>
<text y="150"><tspan x="16.0" fill="#79C0FF">Alice</tspan><tspan x="66.4" fill="#FF7B72">-&gt;</tspan><tspan x="91.6" fill="#79C0FF">Bob</tspan><tspan x="116.8" fill="#E6EDF3">:</tspan><tspan x="125.2" fill="#E6EDF3"> Hello World</tspan></text>
<text y="170"><tspan x="16.0" fill="#79C0FF">Bob</tspan><tspan x="49.6" fill="#FF7B72">--&gt;</tspan><tspan x="83.2" fill="#79C0FF">Alice</tspan><tspan x="125.2" fill="#E6EDF3">:</tspan><tspan x="133.6" fill="#E6EDF3"> Hi!</tspan></text>
<text y="190"><tspan x="16.0" fill="#FF7B72">@enduml</tspan></text>
<text y="210"><tspan x="16.0" fill="#E6EDF3">```</tspan></text>
</g>
</svg>
